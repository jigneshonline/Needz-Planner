function currentQuarterPeriodLabel(){return`Q${CUR_Q} FY ${CUR_FY}-${String(CUR_FY+1).slice(-2)}`}
function quarterDisplay(q,fy){
  const names={1:"Q1 Apr-Jun",2:"Q2 Jul-Sep",3:"Q3 Oct-Dec",4:"Q4 Jan-Mar"};
  return `${names[q]||`Q${q}`} FY ${fy}-${String(fy+1).slice(-2)}`;
}
function monthFromPeriodLabel(period){
  const m=String(period||"").match(/^([A-Za-z]{3})\s+(\d{4})$/);
  if(!m)return null;
  const mo=MNS.indexOf(m[1])+1;
  return mo>0?{mo,yr:Number(m[2])}:null;
}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function periodRangeFromLabel(period){
  const mp=monthFromPeriodLabel(period);
  if(mp)return{from:f(mp.yr,mp.mo,1),to:f(mp.yr,mp.mo,lastDay(mp.yr,mp.mo))};
  const q=String(period||"").match(/^Q([1-4])\s+FY\s+(\d{4})/);
  if(q){
    const fy=Number(q[2]),qn=Number(q[1]);
    const starts=[[4,fy],[7,fy],[10,fy],[1,fy+1]];
    const ends=[[6,fy],[9,fy],[12,fy],[3,fy+1]];
    const [sm,sy]=starts[qn-1], [em,ey]=ends[qn-1];
    return{from:f(sy,sm,1),to:f(ey,em,lastDay(ey,em))};
  }
  return null;
}

function compareRangeToToday(r){
  if(!r||!r.from||!r.to)return"current";
  const today=f(NOW.getFullYear(),NOW.getMonth()+1,NOW.getDate());
  const from=r.from<r.to?r.from:r.to, to=r.from<r.to?r.to:r.from;
  if(to<today)return"past";
  if(from>today)return"future";
  return"current";
}
function isFutureDate(d){
  if(!d)return false;
  const today=f(NOW.getFullYear(),NOW.getMonth()+1,NOW.getDate());
  return d>today;
}
function periodOptions(periods,selected,includeAll=true){
  const curM=`${MNS[CUR_M-1]} ${CUR_Y}`,curQ=currentQuarterPeriodLabel();
  const seen=new Set();
  const opts=[];
  const add=(value,label)=>{if(!value||seen.has(value))return;seen.add(value);opts.push({value,label});};
  if(includeAll)add("all","All months / quarters");
  add(curM,`Current month (${FULL_MNS[CUR_M-1]} ${CUR_Y})`);
  add(curQ,`Current quarter (${quarterDisplay(CUR_Q,CUR_FY)})`);
  periods.forEach(p=>add(p,p));
  return opts.map(o=>`<option value="${es(o.value)}" ${selected===o.value?"selected":""}>${es(o.label)}</option>`).join("");
}

function statutoryDatesForRange(from,to){

  let y=sd.getFullYear(),m=sd.getMonth()+1;
  while(y<ed.getFullYear()||(y===ed.getFullYear()&&m<=ed.getMonth()+1)){
    out.push(...statutoryDatesForMonth(m,y));
    const nx=nxt(m,y);m=nx[0];y=nx[1];
  }
  const seen=new Set();
  return out.filter(d=>d.date>=start&&d.date<=end).filter(d=>{const k=d.date+d.lb;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function statutoryDatesForMonth(mo,yr){
  const prevMo=mo===1?12:mo-1,prevYr=mo===1?yr-1:yr;
  const ay=`${yr}-${String(yr+1).slice(-2)}`;
  const dates=[
    {date:mo===4?f(yr,4,30):f(yr,mo,7), lb:`TDS Payment (${MNS[prevMo-1]} ${prevYr})`},
    {date:f(yr,mo,11),                  lb:`GSTR-1 Monthly (${MNS[prevMo-1]} ${prevYr})`},
    {date:f(yr,mo,13),                  lb:`IFF Optional - QRMP (${MNS[prevMo-1]} ${prevYr})`},
    {date:f(yr,mo,20),                  lb:`GSTR-3B + Payment Monthly (${MNS[prevMo-1]} ${prevYr})`},
  ];
  if([1,4,7,10].includes(mo)){
    const qMap={1:["Oct-Dec",yr-1],4:["Jan-Mar",yr],7:["Apr-Jun",yr],10:["Jul-Sep",yr]};
    const [qLabel,qYear]=qMap[mo];
    dates.push({date:f(yr,mo,13), lb:`GSTR-1 QRMP (${qLabel} ${qYear})`});
    dates.push({date:f(yr,mo,22), lb:`GSTR-3B + Payment QRMP (${qLabel} ${qYear})`});
  }
  if([7,10,1,5].includes(mo)){
    const qMap={7:["Q1",yr],10:["Q2",yr],1:["Q3",yr-1],5:["Q4",yr-1]};
    const [qLabel,qYear]=qMap[mo];
    const day=mo===5?31:31;
    dates.push({date:f(yr,mo,day), lb:`TDS Return 26Q (${qLabel} FY ${qYear}-${String(qYear+1).slice(-2)})`});
    dates.push({date:f(yr,mo,day), lb:`TDS Return 24Q (${qLabel} FY ${qYear}-${String(qYear+1).slice(-2)})`});
  }
  if([6,9,12,3].includes(mo)){
    dates.push({date:f(yr,mo,15), lb:"Income Tax Advance Tax"});
  }
  if(mo===7){
    dates.push({date:f(yr,7,31), lb:`ITR Filing - salaried / other assessees (AY ${ay})`});
  }
  if(mo===8){
    dates.push({date:f(yr,8,31), lb:`ITR Filing - non-audit business / profession (AY ${ay})`});
  }
  if(mo===9){
    dates.push({date:f(yr,9,30), lb:`Tax Audit Report u/s 44AB (AY ${ay})`});
  }
  if(mo===10){
    dates.push({date:f(yr,10,31), lb:`ITR Filing - audit cases (AY ${ay})`});
  }
  if(mo===11){
    dates.push({date:f(yr,11,30), lb:`Transfer Pricing audit / ITR, if applicable (AY ${ay})`});
  }
  if(mo===12){
    dates.push({date:f(yr,12,31), lb:`Belated / Revised ITR (AY ${ay})`});
  }
  if(mo===3){
    [
      [yr-2,"ITR-U 25% additional tax window ends"],
      [yr-3,"ITR-U 50% additional tax window ends"],
      [yr-4,"ITR-U 60% additional tax window ends"],
      [yr-5,"ITR-U final 48-month deadline / 70% window ends"],
    ].forEach(([ayStart,lb])=>{
      if(ayStart>=2021)dates.push({date:f(yr,3,31), lb:`${lb} (AY ${ayStart}-${String(ayStart+1).slice(-2)})`});
    });
  }
  return dates.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

    if(field==="client")return mult*cmpText(cn(a.clientId),cn(b.clientId));
    if(field==="dueDate")return mult*cmpText(a.dueDate,b.dueDate);
    return mult*cmpText(a[field],b[field]);
  });
}

async function safePeek(key){try{const r=await window.storage.get(key,true);return r&&r.value;}catch(e){return false;}}
async function runAutoGen(){
  const mPeriod=`${MNS[CUR_M-1]} ${CUR_Y}`;
  const qPeriod=`Q${CUR_Q} FY ${CUR_FY}-${String(CUR_FY+1).slice(-2)}`;
  let totalAdded=0; const log=[];
  const mKey=`auto:monthly:${mPeriod}`;
  if(!(await safePeek(mKey))){
    const n=generateBatch("monthly",CUR_M,CUR_Y,null,null);
    if(n>0)log.push({period:mPeriod,count:n,type:"Monthly"});
    await window.storage.set(mKey,"1",true);totalAdded+=n;
  }
  const qKey=`auto:quarterly:${qPeriod}`;
  if(!(await safePeek(qKey))){
    const n=generateBatch("quarterly",null,null,CUR_Q,CUR_FY);
    if(n>0)log.push({period:qPeriod,count:n,type:"Quarterly"});
    await window.storage.set(qKey,"1",true);totalAdded+=n;
  }
  if(totalAdded>0){S.autoLog=log;await sv();}
  return totalAdded;
}

function generateBatch(freq,mo,yr,q,fy){
  const isM=freq==="monthly";const tpls=isM?MT:QT;
  const period=isM?`${MNS[mo-1]} ${yr}`:`Q${q} FY ${fy}-${String(fy+1).slice(-2)}`;
  let added=0;
  S.clients.forEach(c=>{tpls.forEach(t=>{
    if(!(c.services||[]).includes(t.type))return;
    if(t.name==="IFF (QRMP Optional)" && String(c.gstFreq||"Monthly").toLowerCase()!=="quarterly")return;
    if(!incomeTaxTaskApplies(c,t))return;
    const due=isM?mDue(t.name,mo,yr,c.gstFreq||"Monthly"):qDue(t.name,q,fy);
    if(!due)return;
    if(S.tasks.some(x=>x.clientId===c.id&&x.name===t.name&&x.period===period))return;
    const assignee=assigneeFor(c,t);
    S.tasks.push({id:uid(),clientId:c.id,type:t.type,name:t.name,activity:t.act,period,dueDate:due,assignee,status:"Pending",notes:"",createdAt:new Date().toISOString(),autoGen:true});
    added++;
  });});
  return added;
}

async function load(){

      await window.storage.set("bibble:clients",JSON.stringify(S.clients),true);

    } else {
      const c=await window.storage.get("bibble:clients",true);
      const t=await window.storage.get("bibble:tasks",true);
      const sv2=await window.storage.get("bibble:settings",true);
      if(c?.value)S.clients=JSON.parse(c.value);

      if(sv2?.value){const v=JSON.parse(sv2.value);if(v.tNames)S.tNames=v.tNames;if(v.assignRules)S.assignRules=v.assignRules;}
      if(S.tNames[0]==="You")S.tNames[0]="Jignesh";

      if(!S.tNames.includes("CLIENT"))S.tNames.push("CLIENT");

      S.assignRules={"Data Entry":"CLIENT","GST":"Preet","TDS":"Jignesh","Income Tax":"Jignesh","Backup":"Preet",...S.assignRules};
    }
    cleanDeprecatedTasks();
    S.clients.forEach(c=>{if((c.services||[]).includes("Income Tax")&&!c.itProfile)c.itProfile=defaultItProfile(c);});
    ensureClientRules();
    if(!(await safePeek("needz:allocation:screenshot_v1"))){
      applyScreenshotAllocation();

  }catch(e){S.clients=IMPORT_DATA.map((c,i)=>({...c,id:uid(),itProfile:defaultItProfile(c),assignRules:defaultClientRules(i,c.name)}));}
  S.loading=false;render();
}

function insights(){
  const tasks=reportScopedTasks();
  const countBy=(arr,key)=>arr.reduce((m,x)=>{const k=key(x)||"Blank";m[k]=(m[k]||0)+1;return m;},{});
  const status=countBy(tasks,t=>t.status);
  const ass=countBy(tasks,t=>t.assignee);
  const type=countBy(tasks,t=>t.type);
  const open=tasks.filter(t=>t.status!=="Done");
  const overdue=open.filter(t=>du(t.dueDate)!==null&&du(t.dueDate)<0).length;
  const due7=open.filter(t=>{const n=du(t.dueDate);return n!==null&&n>=0&&n<=7}).length;
  const done=tasks.filter(t=>t.status==="Done").length;
  const total=Math.max(tasks.length,1);
  const bar=(label,val,max,color="var(--color-text-info)")=>`<div style="margin-bottom:9px">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${es(label)}</span><strong>${val}</strong></div>
    <div style="height:9px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden"><div style="height:100%;width:${max?Math.round(val/max*100):0}%;background:${color}"></div></div>
  </div>`;
  const maxAss=Math.max(1,...Object.values(ass));
  const maxType=Math.max(1,...Object.values(type));
  const donePct=Math.round(done/total*100);
  const waiting=status["Waiting for Client"]||0;
  const conic=`conic-gradient(var(--color-text-success) 0 ${donePct}%, var(--color-text-warning) ${donePct}% ${donePct+Math.round((status["In Progress"]||0)/total*100)}%, var(--color-text-danger) ${donePct+Math.round((status["In Progress"]||0)/total*100)}% ${donePct+Math.round(((status["In Progress"]||0)+overdue)/total*100)}%, #d8dee6 0)`;
  const periods=[...new Set(S.tasks.map(t=>t.period).filter(Boolean))].sort((a,b)=>(a>b?1:-1));
  const fys=recentFYs(3);
  return`<div>
    <div class="toolbar">
      <select id="r-mode" style="width:auto"><option value="period" ${S.rMode==="period"?"selected":""}>Month / Quarter</option><option value="fy" ${S.rMode==="fy"?"selected":""}>Financial year</option><option value="custom" ${S.rMode==="custom"?"selected":""}>Custom dates</option></select>
      ${S.rMode==="period"?`<select id="ff-pe" style="width:auto;max-width:240px">${periodOptions(periods,S.fPeriod,true)}</select>`:""}
      ${S.rMode==="fy"?`<select id="r-fy" style="width:auto"><option value="all">Last 3 FY</option>${fys.map(y=>`<option value="${y}" ${Number(S.rFY)===y?"selected":""}>FY ${y}-${String(y+1).slice(-2)}</option>`).join("")}</select>`:""}
      ${S.rMode==="custom"?`<input type="date" id="r-from" value="${es(S.rFrom)}" style="width:auto"><input type="date" id="r-to" value="${es(S.rTo)}" style="width:auto">`:""}
      <select id="ff-as" style="width:auto"><option value="all">All assignees</option>${S.tNames.map(a=>`<option ${S.fAss===a?"selected":""}>${es(a)}</option>`).join("")}</select>
      <select id="ff-ty" style="width:auto"><option value="all">All types</option>${TAX_T.map(t=>`<option ${S.fType===t?"selected":""}>${t}</option>`).join("")}</select>
      <select id="ff-st" style="width:auto"><option value="all">All statuses</option>${STATS.map(s=>`<option ${S.fStat===s?"selected":""}>${s}</option>`).join("")}</select>
      <span style="font-size:12px;color:var(--color-text-tertiary)">Charts follow these filters.</span>
    </div>
    <div class="kpi-grid">
      ${[
        ["Tasks",tasks.length,"ti-list-check","var(--color-text-info)"],
        ["Open",open.length,"ti-clock","var(--color-text-warning)"],
        ["Done",done,"ti-circle-check","var(--color-text-success)"],
        ["Due 7 days",due7,"ti-calendar-event","var(--color-text-info)"],
        ["Overdue",overdue,"ti-alert-circle","var(--color-text-danger)"],
      ].map(m=>`<div class="metric"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px"><i class="ti ${m[2]}" style="color:${m[3]};margin-right:3px"></i>${m[0]}</p><p style="font-size:24px;font-weight:500;color:${m[3]}">${m[1]}</p></div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
      <div class="card">
        <p style="font-size:13px;font-weight:500;margin-bottom:12px">Status mix</p>
        <div style="display:flex;align-items:center;gap:18px">
          <div style="width:150px;height:150px;border-radius:50%;background:${conic};position:relative"><div style="position:absolute;inset:32px;border-radius:50%;background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600">${donePct}%</div></div>
          <div style="flex:1">${Object.entries(status).map(([k,v])=>bar(k,v,total,k==="Done"?"var(--color-text-success)":k==="In Progress"?"var(--color-text-info)":"var(--color-text-warning)")).join("")}</div>
        </div>
      </div>
      <div class="card"><p style="font-size:13px;font-weight:500;margin-bottom:12px">Team workload</p>${Object.entries(ass).map(([k,v])=>bar(k,v,maxAss,k==="CLIENT"?"var(--color-text-secondary)":k==="Preet"?"var(--color-text-info)":"var(--color-text-success)")).join("")||`<p style="font-size:13px;color:var(--color-text-tertiary)">No tasks</p>`}</div>
      <div class="card"><p style="font-size:13px;font-weight:500;margin-bottom:12px">Work type</p>${Object.entries(type).map(([k,v])=>bar(k,v,maxType,k==="GST"?"var(--color-text-info)":k==="TDS"?"var(--color-text-warning)":"var(--color-text-success)")).join("")||`<p style="font-size:13px;color:var(--color-text-tertiary)">No tasks</p>`}</div>
    </div>
    <div class="card" style="margin-top:14px">
      <p style="font-size:13px;font-weight:500;margin-bottom:12px">Risk tracker</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Waiting for client</p><p style="font-size:24px;font-weight:500">${waiting}</p></div>
        <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Due within 7 days</p><p style="font-size:24px;font-weight:500">${due7}</p></div>
        <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Overdue</p><p style="font-size:24px;font-weight:500;color:var(--color-text-danger)">${overdue}</p></div>
      </div>
    </div>
    ${performanceMatrix(tasks)}
  </div>`;
}

function reports(){
  const periods=[...new Set(S.tasks.map(t=>t.period).filter(Boolean))].sort((a,b)=>(a>b?1:-1));
  const fys=recentFYs(3);
  if(S.rMode==="period"&&S.fPeriod==="all"&&periods.length)S.fPeriod=periods[periods.length-1];
  const period=S.rMode==="period"?S.fPeriod:(S.rMode==="fy"?(S.rFY==="all"?"Last 3 financial years":`FY ${S.rFY}-${String(Number(S.rFY)+1).slice(-2)}`):`${S.rFrom||"Start"} to ${S.rTo||"Today"}`);
  const tasks=reportScopedTasks();
  const count=(fn)=>tasks.filter(fn).length;
  const total=tasks.length||1;
  const done=count(t=>t.status==="Done");
  const pending=count(t=>t.status==="Pending");
  const inprog=count(t=>t.status==="In Progress");
  const overdue=count(t=>t.status!=="Done"&&du(t.dueDate)!==null&&du(t.dueDate)<0);
  const waiting=count(t=>t.status==="Waiting for Client");
  const completion=Math.round(done/total*100);
  const byMember=S.tNames.map(n=>{
    const arr=tasks.filter(t=>t.assignee===n);const d=arr.filter(t=>t.status==="Done").length;
    return {name:n,total:arr.length,done:d,open:arr.length-d,rate:arr.length?Math.round(d/arr.length*100):0};
  });
  const byType=TAX_T.map(n=>{
    const arr=tasks.filter(t=>t.type===n);const d=arr.filter(t=>t.status==="Done").length;
    return {name:n,total:arr.length,done:d,open:arr.length-d,rate:arr.length?Math.round(d/arr.length*100):0};
  });
  const maxMember=Math.max(1,...byMember.map(x=>x.total));
  const bar=(x,color)=>`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${es(x.name)}</span><strong>${x.done}/${x.total} (${x.rate}%)</strong></div>
    <div style="height:10px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.round(x.total/maxMember*100)}%;background:${color}"></div></div>
  </div>`;
  return`<div>
    <div class="toolbar">
      <select id="r-mode" style="width:auto"><option value="period" ${S.rMode==="period"?"selected":""}>Month / Quarter</option><option value="fy" ${S.rMode==="fy"?"selected":""}>Financial year</option><option value="custom" ${S.rMode==="custom"?"selected":""}>Custom dates</option></select>
      ${S.rMode==="period"?`<select id="ff-pe" style="width:auto;max-width:240px">${periodOptions(periods,S.fPeriod,false)}</select>`:""}
      ${S.rMode==="fy"?`<select id="r-fy" style="width:auto"><option value="all">Last 3 FY</option>${fys.map(y=>`<option value="${y}" ${Number(S.rFY)===y?"selected":""}>FY ${y}-${String(y+1).slice(-2)}</option>`).join("")}</select>`:""}
      ${S.rMode==="custom"?`<input type="date" id="r-from" value="${es(S.rFrom)}" style="width:auto"><input type="date" id="r-to" value="${es(S.rTo)}" style="width:auto">`:""}
      <select id="ff-as" style="width:auto"><option value="all">All assignees</option>${S.tNames.map(a=>`<option ${S.fAss===a?"selected":""}>${es(a)}</option>`).join("")}</select>
      <select id="ff-ty" style="width:auto"><option value="all">All types</option>${TAX_T.map(t=>`<option ${S.fType===t?"selected":""}>${t}</option>`).join("")}</select>
      <span style="font-size:12px;color:var(--color-text-tertiary)">Previous selection performance report</span>
    </div>
    <div class="kpi-grid">
      ${[
        ["Selection",period,"ti-calendar","var(--color-text-secondary)"],
        ["Tasks",tasks.length,"ti-list-check","var(--color-text-info)"],
        ["Done",done,"ti-circle-check","var(--color-text-success)"],
        ["Pending",pending+inprog,"ti-clock","var(--color-text-warning)"],
        ["Waiting",waiting,"ti-hourglass","var(--color-text-info)"],
        ["Overdue",overdue,"ti-alert-circle","var(--color-text-danger)"],
      ].map(m=>`<div class="metric"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px"><i class="ti ${m[2]}" style="color:${m[3]};margin-right:3px"></i>${m[0]}</p><p style="font-size:${m[0]==="Selection"?"16px":"24px"};font-weight:500;color:${m[3]}">${m[1]}</p></div>`).join("")}
    </div>
    <div class="two-col">
      <div class="card"><p style="font-size:13px;font-weight:500;margin-bottom:12px">Team member performance</p>${byMember.map(x=>bar(x,x.name==="Preet"?"var(--color-text-info)":x.name==="Jignesh"?"var(--color-text-success)":"var(--color-text-secondary)")).join("")}</div>
      <div class="card"><p style="font-size:13px;font-weight:500;margin-bottom:12px">Work-type performance</p>${byType.map(x=>bar(x,x.name==="GST"?"var(--color-text-info)":x.name==="TDS"?"var(--color-text-warning)":"var(--color-text-success)")).join("")}</div>
    </div>
    <div class="card" style="margin-top:14px">
      <p style="font-size:13px;font-weight:500;margin-bottom:8px">Completion score</p>
      <div style="height:18px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden"><div style="height:100%;width:${completion}%;background:var(--color-text-success)"></div></div>
      <p style="font-size:12px;color:var(--color-text-tertiary);margin-top:6px">${completion}% completed for ${es(period)}.</p>
    </div>
    ${performanceMatrix(tasks)}
  </div>`;
}

function gen(){
  const isM=S.gFreq==="monthly";
  const tpls=isM?MT:QT;
  const displayTpls=tpls.filter(t=>isM||qDue(t.name,S.gQ,S.gFY));
  const period=isM?`${MNS[S.gMo-1]} ${S.gYr}`:`Q${S.gQ} FY ${S.gFY}-${String(S.gFY+1).slice(-2)}`;
  const curPeriod=`${MNS[CUR_M-1]} ${CUR_Y}`;
  const nextM=nextMonthPeriod();
  const nextQ=nextQuarterPeriod();
  const countPeriod=p=>S.tasks.filter(t=>t.period===p).length;
  const delCount=futureGeneratedCount(period);
  let prev=0;
  S.clients.forEach(c=>{tpls.forEach(t=>{
    if(!(c.services||[]).includes(t.type))return;
    if(t.name==="IFF (QRMP Optional)" && String(c.gstFreq||"Monthly").toLowerCase()!=="quarterly")return;
    if(!incomeTaxTaskApplies(c,t))return;
    const due=isM?mDue(t.name,S.gMo,S.gYr,c.gstFreq||"Monthly"):qDue(t.name,S.gQ,S.gFY);
    if(!due)return;
    if(S.tasks.some(x=>x.clientId===c.id&&x.name===t.name&&x.period===period))return;
    prev++;
  });});

  const mOpts=MNS.map((m,i)=>`<option value="${i+1}" ${S.gMo===i+1?"selected":""}>${m}</option>`).join("");

  return`<div>
  <div class="info-box">
    <i class="ti ti-robot" style="margin-right:6px"></i>
    <strong>Auto-generation rule:</strong> when you open the app, it creates the <strong>current month</strong> and <strong>current quarter</strong> if they do not already exist. It does not automatically create next month before the month begins unless you use the buttons below.
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px">
    <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Current month (${FULL_MNS[CUR_M-1]} ${CUR_Y})</p><p style="font-size:18px;font-weight:500">${curPeriod}</p><p style="font-size:12px;color:var(--color-text-tertiary)">${countPeriod(curPeriod)} tasks generated</p></div>
    <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Next month</p><p style="font-size:18px;font-weight:500">${nextM.label}</p><p style="font-size:12px;color:var(--color-text-tertiary)">${countPeriod(nextM.label)} tasks generated</p><button class="btn" id="bnextmo" style="margin-top:8px;width:100%">Generate next month</button></div>
    <div class="metric"><p style="font-size:11px;color:var(--color-text-secondary)">Next quarter (${quarterDisplay(nextQ.q,nextQ.fy)})</p><p style="font-size:18px;font-weight:500">${nextQ.label}</p><p style="font-size:12px;color:var(--color-text-tertiary)">${countPeriod(nextQ.label)} tasks generated</p><button class="btn" id="bnextqt" style="margin-top:8px;width:100%">Generate next quarter</button></div>
  </div>

  <div class="formbox">
    <p style="font-size:14px;font-weight:500;margin-bottom:6px">Assignee rules <span style="font-size:12px;font-weight:400;color:var(--color-text-tertiary)">(used by auto-generation too)</span></p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:10px">
      ${RULE_T.map(t=>`<div><label class="fl"><span style="display:inline-flex;align-items:center;gap:5px">${t==="Data Entry"?"Data Entry":tb(t)} &rarr; </span></label>
        <select class="rule-sel" data-type="${t}">${S.tNames.map(n=>`<option value="${es(n)}" ${S.assignRules[t]===n?"selected":""}>${es(n)}</option>`).join("")}</select></div>`).join("")}
    </div>
    <button class="btn" id="bsaverules" style="font-size:12px">Save rules</button>
  </div>

  <div class="formbox">
    <p style="font-size:14px;font-weight:500;margin-bottom:4px">Manual generate</p>
    <p style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:12px">Select any month or quarter from <strong>2026 onward</strong> to generate or back-fill tasks.</p>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn" id="bfmo" style="${isM?"font-weight:600":""}"><i class="ti ti-calendar" style="margin-right:5px"></i>Monthly</button>
      <button class="btn" id="bfqt" style="${!isM?"font-weight:600":""}"><i class="ti ti-calendar-stats" style="margin-right:5px"></i>Quarterly</button>
    </div>
    ${isM
      ?`<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
          <div style="width:130px"><label class="fl">Month</label><select id="gmo">${mOpts}</select></div>
          <div style="width:140px"><label class="fl">Year (2026-2030)</label><select id="gyr">${yearOpts(S.gYr)}</select></div>
          <p style="font-size:12px;color:var(--color-text-tertiary);padding-bottom:8px">Selection: <strong>${period}</strong></p>
        </div>`
      :`<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
          <div style="width:160px"><label class="fl">Quarter</label><select id="gqt">${["Q1 Apr-Jun","Q2 Jul-Sep","Q3 Oct-Dec","Q4 Jan-Mar"].map((lb,i)=>`<option value="${i+1}" ${S.gQ===i+1?"selected":""}>${lb}</option>`).join("")}</select></div>
          <div style="width:160px"><label class="fl">Financial Year (2026-2030)</label><select id="gfy">${fyOpts(S.gFY)}</select></div>
          <p style="font-size:12px;color:var(--color-text-tertiary);padding-bottom:8px">Selection: <strong>${period}</strong></p>
        </div>`
    }
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:14px">
      ${displayTpls.map(t=>{
        const sampleDue=isM?mDue(t.name,S.gMo,S.gYr,"Monthly"):qDue(t.name,S.gQ,S.gFY);
        return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
          <span style="flex:1;font-size:13px">${es(t.name)}</span>
          ${tb(t.type)}
          <span style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap;min-width:90px;text-align:right">${sampleDue?"~"+fd(sampleDue):""}</span>
          <span style="font-size:11px;color:var(--color-text-tertiary);white-space:nowrap;min-width:60px;text-align:right">-> ${es(S.assignRules[t.type]||S.tNames[0])}</span>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-primary" id="bgen" style="font-size:14px;padding:9px 20px;font-weight:500">
        <i class="ti ti-sparkles" style="margin-right:6px"></i>Generate ${prev} task${prev!==1?"s":""}
      </button>
      <button class="btn" id="bdelgen" ${delCount===0?"disabled":""} style="font-size:14px;padding:9px 16px">
        <i class="ti ti-trash" style="margin-right:6px"></i>Delete ${delCount} future generated task${delCount!==1?"s":""}
      </button>
      ${prev===0?`<p style="font-size:12px;color:var(--color-text-tertiary)">All tasks already exist for this selection.</p>`:""}
    </div>
  </div></div>`;
}

function bind(){
  const g=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const e=g(id);if(e)e.addEventListener(ev,fn)};
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;render()}));
  on("dash-mode","change",()=>{S.dashMode=g("dash-mode").value;render()});
  on("dash-period","change",()=>{S.dashPeriod=g("dash-period").value;render()});
  on("dash-fy","change",()=>{S.dashFY=g("dash-fy").value;render()});
  on("dash-from","change",()=>{S.dashFrom=g("dash-from").value;render()});
  on("dash-to","change",()=>{S.dashTo=g("dash-to").value;render()});
  on("bsett","click",()=>{S.showSett=!S.showSett;render()});
  on("bsett-close","click",()=>{S.showSett=false;render()});
  on("bedit-rules","click",()=>{S.showSett=true;render()});
  on("bsnm","click",()=>{
    S.tNames=[...document.querySelectorAll(".team-name")].map(x=>x.value.trim()).filter(Boolean);
    if(!S.tNames.includes("CLIENT"))S.tNames.push("CLIENT");
    document.querySelectorAll(".rule-sel").forEach(sel=>{S.assignRules[sel.dataset.type]=sel.value;});
    S.showSett=false;sv();render();
  });
  on("new-member","input",()=>{S.newMember=g("new-member").value});
  on("badd-member","click",()=>{const n=(g("new-member")||{}).value||"";if(!n.trim())return;if(!S.tNames.includes(n.trim()))S.tNames.push(n.trim());S.newMember="";sv();render();});
  document.querySelectorAll("[data-del-member]").forEach(b=>b.addEventListener("click",()=>{
    const name=b.dataset.delMember;
    if(name==="CLIENT")return;
    if(!confirm(`Delete team member ${name}? Existing tasks will move to ${S.tNames[0]||"Jignesh"}.`))return;
    const fallback=S.tNames.find(n=>n!==name&&n!=="CLIENT")||"Jignesh";
    S.tNames=S.tNames.filter(n=>n!==name);
    Object.keys(S.assignRules).forEach(k=>{if(S.assignRules[k]===name)S.assignRules[k]=fallback;});
    S.clients.forEach(c=>{Object.keys(c.assignRules||{}).forEach(k=>{if(c.assignRules[k]===name)c.assignRules[k]=fallback;});});
    S.tasks.forEach(t=>{if(t.assignee===name)t.assignee=fallback;});
    sv();render();
  }));
  on("btemplate","click",()=>{
    const a=document.createElement("a");
    a.href="data:application/vnd.ms-excel;charset=utf-8,"+encodeURIComponent(plannerTemplateXls());
    a.download=`needz_planner_template_${new Date().toISOString().split("T")[0]}.xls`;
    a.click();
  });
  on("template-file","change",()=>{
    const file=(g("template-file").files||[])[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        let data;
        try{data=JSON.parse(reader.result);}
        catch(_){data=parsePlannerTemplateHtml(reader.result);}
        if(!Array.isArray(data.clients))throw new Error("Template must contain a clients list.");
        S.clients=data.clients;
        S.tasks=Array.isArray(data.tasks)?data.tasks:[];
        S.tNames=Array.isArray(data.teamMembers)?data.teamMembers:(Array.isArray(data.tNames)?data.tNames:S.tNames);
        if(!S.tNames.includes("CLIENT"))S.tNames.push("CLIENT");
        S.assignRules=data.assignRules||S.assignRules;
        ensureClientRules();
        sv();alert("Template uploaded. The planner will now run from this data.");render();
      }catch(e){alert("Could not import template: "+e.message);}
    };
    reader.readAsText(file);
  });
  on("bsaverules","click",()=>{
    document.querySelectorAll(".rule-sel").forEach(sel=>{S.assignRules[sel.dataset.type]=sel.value;});
    sv();render();
  });
  on("cl-search","input",()=>{S.clSearch=g("cl-search").value;render()});
  document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{
    const scope=b.dataset.sortScope,key=b.dataset.sort;
    const map={clients:["clSort","clDir"],allocation:["allocSort","allocDir"],planner:["taskSort","taskDir"]};
    const cfg=map[scope];if(!cfg)return;
    const [sk,dk]=cfg;
    if(S[sk]===key)S[dk]=S[dk]==="asc"?"desc":"asc";else{S[sk]=key;S[dk]="asc";}
    render();
  }));
  on("btogcl","click",()=>{S.showAddClient=!S.showAddClient;render()});
  on("bcncl","click",()=>{S.showAddClient=false;render()});
  on("bsvcl","click",()=>{
    const name=(g("nc-n")||{}).value||"";if(!name.trim())return;
    const svcs=[...document.querySelectorAll(".ncsvc:checked")].map(x=>x.value);
    S.clients.push({id:uid(),name:name.trim(),pan:(g("nc-p")||{}).value||"",gstin:(g("nc-g")||{}).value||"",gstFreq:(g("nc-gf")||{}).value||"Monthly",itProfile:(g("nc-itp")||{}).value||"Business - Non-audit",contact:(g("nc-cp")||{}).value||"",mobile:(g("nc-mo")||{}).value||"",email:(g("nc-em")||{}).value||"",services:svcs,notes:[]});
    S.showAddClient=false;sv();render();
  });
  document.querySelectorAll("[data-dclid]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete client and all their tasks?")){S.clients=S.clients.filter(c=>c.id!==b.dataset.dclid);S.tasks=S.tasks.filter(t=>t.clientId!==b.dataset.dclid);sv();render();}}));
  document.querySelectorAll("[data-edit-client]").forEach(b=>b.addEventListener("click",()=>{S.editClientId=b.dataset.editClient;render()}));
  document.querySelectorAll("[data-cancel-edit]").forEach(b=>b.addEventListener("click",()=>{S.editClientId=null;render()}));
  document.querySelectorAll("[data-save-client]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.saveClient,c=S.clients.find(x=>x.id===id);if(!c)return;
    c.name=(g(`ec-name-${id}`)||{}).value||c.name;
    c.pan=(g(`ec-pan-${id}`)||{}).value||"";
    c.gstin=(g(`ec-gstin-${id}`)||{}).value||"";
    c.gstFreq=(g(`ec-gf-${id}`)||{}).value||"Monthly";
    c.contact=(g(`ec-contact-${id}`)||{}).value||"";
    c.mobile=(g(`ec-mobile-${id}`)||{}).value||"";
    c.email=(g(`ec-email-${id}`)||{}).value||"";
    c.itProfile=(g(`ec-itp-${id}`)||{}).value||"Business - Non-audit";
    c.services=[...document.querySelectorAll(`.ec-svc-${id}:checked`)].map(x=>x.value);
    S.editClientId=null;sv();render();
  }));
  document.querySelectorAll(".client-rule,.alloc-rule").forEach(sel=>sel.addEventListener("change",()=>{
    const c=S.clients.find(x=>x.id===sel.dataset.cid);if(!c)return;
    if(!c.assignRules)c.assignRules=defaultClientRules();
    c.assignRules[sel.dataset.rule]=sel.value;
    updateTaskAssignmentsForClient(c,sel.dataset.rule);
    sv();
  }));
  document.querySelectorAll(".it-profile").forEach(sel=>sel.addEventListener("change",()=>{
    const c=S.clients.find(x=>x.id===sel.dataset.cid);if(!c)return;
    c.itProfile=sel.value;
    sv();render();
  }));
  document.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>{
    const visible=S.clients.filter(c=>!S.clSearch||c.name.toLowerCase().includes(S.clSearch.toLowerCase())||c.pan.toLowerCase().includes(S.clSearch.toLowerCase()));
    applyProfile(b.dataset.profile,visible);sv();render();
  }));
  on("bapply-service","click",()=>{
    const visible=S.clients.filter(c=>!S.clSearch||c.name.toLowerCase().includes(S.clSearch.toLowerCase())||c.pan.toLowerCase().includes(S.clSearch.toLowerCase()));
    applyServiceAllocation(g("alloc-service").value,g("alloc-member").value,visible);sv();render();
  });
  document.querySelectorAll("[data-exn]").forEach(b=>b.addEventListener("click",()=>{S.expNotes=S.expNotes===b.dataset.exn?null:b.dataset.exn;render()}));
  document.querySelectorAll("[data-anote]").forEach(b=>b.addEventListener("click",()=>{
    const cid=b.dataset.anote;const txt=(g(`ni-${cid}`)||{}).value||"";if(!txt.trim())return;
    const c=S.clients.find(x=>x.id===cid);if(!c)return;if(!c.notes)c.notes=[];
    c.notes.unshift({id:uid(),text:txt.trim(),ts:new Date().toISOString()});
    S.noteIn[cid]="";sv();render();
  }));
  document.querySelectorAll("textarea[id^='ni-']").forEach(ta=>ta.addEventListener("input",()=>{S.noteIn[ta.id.slice(3)]=ta.value}));
  [["ff-cl","fCl"],["ff-pe","fPeriod"],["ff-ty","fType"],["ff-task","fTask"],["ff-as","fAss"],["ff-st","fStat"]].forEach(([id,k])=>on(id,"change",()=>{S[k]=g(id).value;render()}));
  on("bcsv","click",()=>{
    const csv=taskCsvRows(S.tasks.filter(taskMatches));
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`needz_planner_${new Date().toISOString().split("T")[0]}.csv`;a.click();
  });
  on("bmembercsv","click",()=>{
    const member=S.fAss==="all"?prompt("Export task list for which member?",S.tNames[0]||"Jignesh"):S.fAss;
    if(!member)return;const rows=S.tasks.filter(t=>taskMatches(t)&&t.assignee===member);
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(taskCsvRows(rows));a.download=`needz_tasks_${member.replace(/\\s+/g,"_")}_${new Date().toISOString().split("T")[0]}.csv`;a.click();
  });
  on("bmailtasks","click",()=>{
    const member=S.fAss==="all"?prompt("Prepare email task list for which member?",S.tNames[0]||"Jignesh"):S.fAss;
    if(!member)return;const rows=S.tasks.filter(t=>taskMatches(t)&&t.assignee===member);
    const subject=`NEEDZ task list - ${member}`;
    const body=`Dear ${member},\n\nPlease find your task list below:\n\n${memberTaskSummary(member,rows)||"No tasks for current filters."}\n\nRegards,\nNEEDZ CONSULTANCY`;
    location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
  on("btogtk","click",()=>{S.showAddTask=!S.showAddTask;render()});
  on("bcntk","click",()=>{S.showAddTask=false;render()});
  [["nt-cl","clientId",false],["nt-ty","type",true],["nt-nm","name",true],["nt-ac","activity",false],["nt-as","assignee",false],["nt-st","status",false],["nt-dd","dueDate",false]].forEach(([id,k,re])=>on(id,"change",()=>{S.nt[k]=g(id).value;if(k==="type"){S.nt.name="";S.nt.activity="";}if(k==="name"){S.nt.activity=AA[g(id).value]||S.nt.activity;}if(re)render()}));
  [["nt-pe","period"],["nt-no","notes"],["nt-cu","custom"]].forEach(([id,k])=>on(id,"input",()=>{S.nt[k]=(g(id)||{}).value||""}));
  on("bsvtk","click",()=>{
    const n=S.nt;const name=n.name==="Other..."?n.custom:n.name;
    if(!name||!n.clientId){alert("Please select a client and task name.");return;}
    S.tasks.push({id:uid(),clientId:n.clientId,type:n.type,name,activity:n.activity||"Data Entry",period:n.period,dueDate:n.dueDate,assignee:n.assignee,status:n.status,notes:n.notes,createdAt:new Date().toISOString()});
    S.nt={clientId:"",type:"GST",name:"",custom:"",activity:"",period:"",dueDate:"",assignee:S.tNames[0]||"You",status:"Pending",notes:""};
    S.showAddTask=false;sv();render();
  });
  document.querySelectorAll("[data-sid]").forEach(sel=>sel.addEventListener("change",()=>{const t=S.tasks.find(x=>x.id===sel.dataset.sid);if(t){t.status=sel.value;sv();render();}}));
  document.querySelectorAll("[data-aid]").forEach(sel=>sel.addEventListener("change",()=>{const t=S.tasks.find(x=>x.id===sel.dataset.aid);if(t){t.assignee=sel.value;sv();render();}}));
  document.querySelectorAll("[data-dtid]").forEach(b=>b.addEventListener("click",()=>{const t=S.tasks.find(x=>x.id===b.dataset.dtid);if(!t||!isFutureDate(t.dueDate))return;S.tasks=S.tasks.filter(x=>x.id!==b.dataset.dtid);sv();render()}));
  on("bfmo","click",()=>{S.gFreq="monthly";render()});
  on("bfqt","click",()=>{S.gFreq="quarterly";render()});
  on("gmo","change",()=>{S.gMo=+g("gmo").value;render()});
  on("gyr","change",()=>{S.gYr=+g("gyr").value;render()});
  on("gqt","change",()=>{S.gQ=+g("gqt").value;render()});
  on("gfy","change",()=>{S.gFY=+g("gfy").value;render()});
  on("bnextmo","click",()=>{const p=nextMonthPeriod();const n=generateBatch("monthly",p.mo,p.yr,null,null);sv();alert(n>0?`Generated ${n} tasks for ${p.label}.`:`All tasks already exist for ${p.label}.`);render();});
  on("bnextqt","click",()=>{const p=nextQuarterPeriod();const n=generateBatch("quarterly",null,null,p.q,p.fy);sv();alert(n>0?`Generated ${n} tasks for ${p.label}.`:`All tasks already exist for ${p.label}.`);render();});
  on("r-mode","change",()=>{S.rMode=g("r-mode").value;render()});
  on("r-fy","change",()=>{S.rFY=g("r-fy").value;render()});
  on("r-from","change",()=>{S.rFrom=g("r-from").value;render()});
  on("r-to","change",()=>{S.rTo=g("r-to").value;render()});
  on("bgen","click",()=>{
    const isM=S.gFreq==="monthly";
    const period=isM?`${MNS[S.gMo-1]} ${S.gYr}`:`Q${S.gQ} FY ${S.gFY}-${String(S.gFY+1).slice(-2)}`;
    const n=generateBatch(S.gFreq,S.gMo,S.gYr,S.gQ,S.gFY);
    sv();
    if(n>0){S.tab="planner";alert(`Generated ${n} tasks for ${period}. Opening Planner.`);}
    else alert("No new tasks - all already exist for this selection.");
    render();
  });
  on("bdelgen","click",()=>{
    const isM=S.gFreq==="monthly";
    const period=isM?`${MNS[S.gMo-1]} ${S.gYr}`:`Q${S.gQ} FY ${S.gFY}-${String(S.gFY+1).slice(-2)}`;
    const n=futureGeneratedCount(period);
    if(n===0)return;
    if(!confirm(`Delete ${n} future generated task${n!==1?"s":""} for ${period}?`))return;
    S.tasks=S.tasks.filter(t=>!(t.autoGen&&t.period===period&&isFutureDate(t.dueDate)));
    sv();render();
  });
}

load();
</script>
</body>
</html>
