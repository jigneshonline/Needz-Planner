async function safePeek(key){try{const r=await window.storage.get(key,true);return r&&r.value;}catch(e){return false;}}
async function runAutoGen(){
  const mPeriod=`${MNS[CUR_M-1]} ${CUR_Y}`;
  const qPeriod=`Q${CUR_Q} FY ${CUR_FY}-${String(CUR_FY+1).slice(-2)}`;
  let totalAdded=0; const log=[];
  const mKey=`auto:monthly:${mPeriod}`;
  if(!(await safePeek(mKey))){
    const n=generateBatch("monthly",CUR_M,CUR_Y,null,null);
    if(n>0)log.push({period:mPeriod,count:n,type:"Monthly"});
    await window.storage.set(mKey,"1",true);totalAdded+=n;
  }
  const qKey=`auto:quarterly:${qPeriod}`;
  if(!(await safePeek(qKey))){
    const n=generateBatch("quarterly",null,null,CUR_Q,CUR_FY);
    if(n>0)log.push({period:qPeriod,count:n,type:"Quarterly"});
    await window.storage.set(qKey,"1",true);totalAdded+=n;
  }
  if(totalAdded>0){S.autoLog=log;await sv();}
  return totalAdded;
}

function generateBatch(freq,mo,yr,q,fy){
  const isM=freq==="monthly";const tpls=isM?MT:QT;
  const period=isM?`${MNS[mo-1]} ${yr}`:`Q${q} FY ${fy}-${String(fy+1).slice(-2)}`;
  let added=0;
  S.clients.forEach(c=>{tpls.forEach(t=>{
    if(!(c.services||[]).includes(t.type))return;
    if(S.tasks.some(x=>x.clientId===c.id&&x.name===t.name&&x.period===period))return;
    const due=isM?mDue(t.name,mo,yr,c.gstFreq||"Monthly"):qDue(t.name,q,fy);
    const assignee=assigneeFor(c,t);
    S.tasks.push({id:uid(),clientId:c.id,type:t.type,name:t.name,activity:t.act,period,dueDate:due,assignee,status:"Pending",notes:"",createdAt:new Date().toISOString(),autoGen:true});
    added++;
  });});
  return added;
}

      if(!S.tNames.includes("CLIENT"))S.tNames.push("CLIENT");
      Object.keys(S.assignRules).forEach(k=>{if(S.assignRules[k]==="You")S.assignRules[k]="Jignesh";if(S.assignRules[k]==="Team")S.assignRules[k]="Preet";});
      S.assignRules={"Data Entry":"CLIENT","GST":"Preet","TDS":"Jignesh","Income Tax":"Jignesh","Backup":"Preet",...S.assignRules};
    }
    ensureClientRules();
    if(!(await safePeek("needz:allocation:screenshot_v1"))){
      applyScreenshotAllocation();
      realignAutoGeneratedTasks();
      await window.storage.set("needz:allocation:screenshot_v1","1",true);
    }
    await runAutoGen();
  }catch(e){S.clients=IMPORT_DATA.map((c,i)=>({...c,id:uid(),assignRules:defaultClientRules(i,c.name)}));}
  S.loading=false;render();
}

        <td style="padding:8px 10px;max-width:140px"><p style="font-size:13px">${es(t.name)}</p>${t.notes?`<p style="font-size:11px;color:var(--color-text-tertiary)">${es(t.notes)}</p>`:""}</td>
        <td style="padding:8px 10px">${tb(t.type)}</td>
        <td style="padding:8px 10px;font-size:12px;color:var(--color-text-secondary);white-space:nowrap">${es(t.activity||"—")}</td>
        <td style="padding:8px 10px;font-size:12px;color:var(--color-text-secondary);white-space:nowrap">${es(t.period||"—")}</td>
        <td style="padding:8px 10px"><p style="font-size:12px;white-space:nowrap">${fd(t.dueDate)}</p><div style="margin-top:2px">${db(t.dueDate)}</div></td>
        <td style="padding:8px 10px;font-size:12px;color:var(--color-text-secondary);white-space:nowrap"><i class="ti ti-user" style="font-size:12px;margin-right:3px"></i>${es(t.assignee)}</td>
        <td style="padding:8px 10px"><select data-sid="${t.id}" style="font-size:12px;padding:3px 5px;background:${sb};color:${sc};border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);width:auto">${STATS.map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
        <td style="padding:8px 6px"><button class="btn btng" data-dtid="${t.id}" style="padding:4px"><i class="ti ti-trash" style="font-size:13px;color:var(--color-text-tertiary)"></i></button></td>
      </tr>`;
    }).join("");

  return`<div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
      <select id="ff-cl" style="width:auto;max-width:180px"><option value="all">All clients</option>${S.clients.map(c=>`<option value="${c.id}" ${S.fCl===c.id?"selected":""}>${es(c.name)}</option>`).join("")}</select>
      <select id="ff-pe" style="width:auto;max-width:160px"><option value="all">All periods</option>${periods.map(p=>`<option value="${es(p)}" ${S.fPeriod===p?"selected":""}>${es(p)}</option>`).join("")}</select>
      <select id="ff-ty" style="width:auto"><option value="all">All types</option>${TAX_T.map(t=>`<option ${S.fType===t?"selected":""}>${t}</option>`).join("")}</select>
      <select id="ff-as" style="width:auto"><option value="all">All assignees</option>${S.tNames.map(a=>`<option ${S.fAss===a?"selected":""}>${es(a)}</option>`).join("")}</select>
      <select id="ff-st" style="width:auto"><option value="all">All statuses</option>${STATS.map(s=>`<option ${S.fStat===s?"selected":""}>${s}</option>`).join("")}</select>
      <button class="btn" id="bcsv" style="font-size:13px"><i class="ti ti-download" style="margin-right:5px"></i>Export CSV</button>
      <button class="btn" id="btogtk" style="margin-left:auto"><i class="ti ti-plus" style="margin-right:5px"></i>Add task</button>
    </div>${af}
    <div style="overflow-x:auto;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg)">
      <table style="width:100%;min-width:720px;border-collapse:collapse">
        <thead><tr style="border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)">
          ${["Client","Task","Type","Activity","Period","Due date","Assignee","Status",""].map(h=>`<th style="padding:9px 10px;text-align:left;font-size:11px;font-weight:500;color:var(--color-text-secondary);white-space:nowrap">${h}</th>`).join("")}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="margin-top:8px;font-size:12px;color:var(--color-text-tertiary)">${fl.length} task${fl.length!==1?"s":""} shown · auto-generates monthly on open</p>
  </div>`;
}

function gen(){
  const isM=S.gFreq==="monthly";
  const tpls=isM?MT:QT;
  const period=isM?`${MNS[S.gMo-1]} ${S.gYr}`:`Q${S.gQ} FY ${S.gFY}-${String(S.gFY+1).slice(-2)}`;
  let prev=0;
  S.clients.forEach(c=>{tpls.forEach(t=>{
    if(!(c.services||[]).includes(t.type))return;
    if(S.tasks.some(x=>x.clientId===c.id&&x.name===t.name&&x.period===period))return;
    prev++;
  });});

  const mOpts=MNS.map((m,i)=>`<option value="${i+1}" ${S.gMo===i+1?"selected":""}>${m}</option>`).join("");

  return`<div>
  <div class="info-box">
    <i class="ti ti-robot" style="margin-right:6px"></i>
    <strong>Auto-generation is ON.</strong> The current month and quarter are created automatically every time you open The Planner. Use this tab only to <strong>back-fill past periods</strong> or <strong>generate ahead</strong>.
  </div>

  <div class="formbox">
    <p style="font-size:14px;font-weight:500;margin-bottom:6px">Assignee rules <span style="font-size:12px;font-weight:400;color:var(--color-text-tertiary)">(used by auto-generation too)</span></p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:10px">
      ${RULE_T.map(t=>`<div><label class="fl"><span style="display:inline-flex;align-items:center;gap:5px">${t==="Data Entry"?"Data Entry":tb(t)} &rarr; </span></label>
        <select class="rule-sel" data-type="${t}">${S.tNames.map(n=>`<option value="${es(n)}" ${S.assignRules[t]===n?"selected":""}>${es(n)}</option>`).join("")}</select></div>`).join("")}
    </div>
    <button class="btn" id="bsaverules" style="font-size:12px">Save rules</button>
  </div>

  <div class="formbox">
    <p style="font-size:14px;font-weight:500;margin-bottom:4px">Manual generate</p>
    <p style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:12px">Select any period from <strong>2026 to 2030</strong> to generate or back-fill tasks.</p>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn" id="bfmo" style="${isM?"font-weight:600":""}"><i class="ti ti-calendar" style="margin-right:5px"></i>Monthly</button>
      <button class="btn" id="bfqt" style="${!isM?"font-weight:600":""}"><i class="ti ti-calendar-stats" style="margin-right:5px"></i>Quarterly</button>
    </div>
    ${isM
      ?`<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
          <div style="width:130px"><label class="fl">Month</label><select id="gmo">${mOpts}</select></div>
          <div style="width:140px"><label class="fl">Year (2026–2030)</label><select id="gyr">${yearOpts(S.gYr)}</select></div>
          <p style="font-size:12px;color:var(--color-text-tertiary);padding-bottom:8px">Period: <strong>${period}</strong></p>
        </div>`
      :`<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
          <div style="width:160px"><label class="fl">Quarter</label><select id="gqt">${["Q1 Apr–Jun","Q2 Jul–Sep","Q3 Oct–Dec","Q4 Jan–Mar"].map((lb,i)=>`<option value="${i+1}" ${S.gQ===i+1?"selected":""}>${lb}</option>`).join("")}</select></div>
          <div style="width:160px"><label class="fl">Financial Year (2026–2030)</label><select id="gfy">${fyOpts(S.gFY)}</select></div>
          <p style="font-size:12px;color:var(--color-text-tertiary);padding-bottom:8px">Period: <strong>${period}</strong></p>
        </div>`
    }
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:14px">
      ${tpls.map(t=>{
        const sampleDue=isM?mDue(t.name,S.gMo,S.gYr,"Monthly"):qDue(t.name,S.gQ,S.gFY);
        return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
          <span style="flex:1;font-size:13px">${es(t.name)}</span>
          ${tb(t.type)}
          <span style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap;min-width:90px;text-align:right">${sampleDue?"~"+fd(sampleDue):""}</span>
          <span style="font-size:11px;color:var(--color-text-tertiary);white-space:nowrap;min-width:60px;text-align:right">→ ${es(S.assignRules[t.type]||S.tNames[0])}</span>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn" id="bgen" style="font-size:14px;padding:9px 20px;font-weight:500">
        <i class="ti ti-sparkles" style="margin-right:6px"></i>Generate ${prev} task${prev!==1?"s":""}
      </button>
      ${prev===0?`<p style="font-size:12px;color:var(--color-text-tertiary)">All tasks already exist for this period.</p>`:""}
    </div>
  </div></div>`;
}

function bind(){
  const g=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const e=g(id);if(e)e.addEventListener(ev,fn)};
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;render()}));
  on("bsett","click",()=>{S.showSett=!S.showSett;render()});
  on("bsett-close","click",()=>{S.showSett=false;render()});
  on("bedit-rules","click",()=>{S.showSett=true;render()});
  on("bsnm","click",()=>{
    S.tNames=[g("nm0").value||"Jignesh",g("nm1").value||"Preet",g("nm2").value||"CLIENT"];
    document.querySelectorAll(".rule-sel").forEach(sel=>{S.assignRules[sel.dataset.type]=sel.value;});
    S.showSett=false;sv();render();
  });
  on("bsaverules","click",()=>{
    document.querySelectorAll(".rule-sel").forEach(sel=>{S.assignRules[sel.dataset.type]=sel.value;});
    sv();render();
  });
  on("cl-search","input",()=>{S.clSearch=g("cl-search").value;render()});
  on("btogcl","click",()=>{S.showAddClient=!S.showAddClient;render()});
  on("bcncl","click",()=>{S.showAddClient=false;render()});
  on("bsvcl","click",()=>{
    const name=(g("nc-n")||{}).value||"";if(!name.trim())return;
    const svcs=[...document.querySelectorAll(".ncsvc:checked")].map(x=>x.value);
    S.clients.push({id:uid(),name:name.trim(),pan:(g("nc-p")||{}).value||"",gstin:(g("nc-g")||{}).value||"",gstFreq:(g("nc-gf")||{}).value||"Monthly",contact:(g("nc-cp")||{}).value||"",mobile:(g("nc-mo")||{}).value||"",email:(g("nc-em")||{}).value||"",services:svcs,notes:[]});
    S.showAddClient=false;sv();render();
  });
  document.querySelectorAll("[data-dclid]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete client and all their tasks?")){S.clients=S.clients.filter(c=>c.id!==b.dataset.dclid);S.tasks=S.tasks.filter(t=>t.clientId!==b.dataset.dclid);sv();render();}}));
  document.querySelectorAll(".client-rule").forEach(sel=>sel.addEventListener("change",()=>{
    const c=S.clients.find(x=>x.id===sel.dataset.cid);if(!c)return;
    if(!c.assignRules)c.assignRules=defaultClientRules();
    c.assignRules[sel.dataset.rule]=sel.value;
    S.tasks.forEach(t=>{
      if(t.clientId!==c.id||!t.autoGen||t.status==="Done")return;
      const key=t.activity==="Data Entry"?"Data Entry":t.type;
      if(key===sel.dataset.rule)t.assignee=sel.value;
    });
    sv();
  }));
  document.querySelectorAll("[data-exn]").forEach(b=>b.addEventListener("click",()=>{S.expNotes=S.expNotes===b.dataset.exn?null:b.dataset.exn;render()}));
  document.querySelectorAll("[data-anote]").forEach(b=>b.addEventListener("click",()=>{
    const cid=b.dataset.anote;const txt=(g(`ni-${cid}`)||{}).value||"";if(!txt.trim())return;
    const c=S.clients.find(x=>x.id===cid);if(!c)return;if(!c.notes)c.notes=[];
    c.notes.unshift({id:uid(),text:txt.trim(),ts:new Date().toISOString()});
    S.noteIn[cid]="";sv();render();
  }));
  document.querySelectorAll("textarea[id^='ni-']").forEach(ta=>ta.addEventListener("input",()=>{S.noteIn[ta.id.slice(3)]=ta.value}));
  [["ff-cl","fCl"],["ff-pe","fPeriod"],["ff-ty","fType"],["ff-as","fAss"],["ff-st","fStat"]].forEach(([id,k])=>on(id,"change",()=>{S[k]=g(id).value;render()}));
  on("bcsv","click",()=>{
    const hdr=["Client","PAN","GSTIN","GST Freq","Task","Tax Type","Activity","Period","Due Date","Assignee","Status","Notes"];
    const rows=S.tasks.filter(taskMatches).map(t=>{const c=S.clients.find(x=>x.id===t.clientId)||{};return[c.name||"",c.pan||"",c.gstin||"",c.gstFreq||"",t.name||"",t.type||"",t.activity||"",t.period||"",t.dueDate||"",t.assignee||"",t.status||"",t.notes||""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")});
    const csv=[hdr.join(","),...rows].join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`needz_planner_${new Date().toISOString().split("T")[0]}.csv`;a.click();
  });
  on("btogtk","click",()=>{S.showAddTask=!S.showAddTask;render()});
  on("bcntk","click",()=>{S.showAddTask=false;render()});
  [["nt-cl","clientId",false],["nt-ty","type",true],["nt-nm","name",true],["nt-ac","activity",false],["nt-as","assignee",false],["nt-st","status",false],["nt-dd","dueDate",false]].forEach(([id,k,re])=>on(id,"change",()=>{S.nt[k]=g(id).value;if(k==="type"){S.nt.name="";S.nt.activity="";}if(k==="name"){S.nt.activity=AA[g(id).value]||S.nt.activity;}if(re)render()}));
  [["nt-pe","period"],["nt-no","notes"],["nt-cu","custom"]].forEach(([id,k])=>on(id,"input",()=>{S.nt[k]=(g(id)||{}).value||""}));
  on("bsvtk","click",()=>{
    const n=S.nt;const name=n.name==="Other..."?n.custom:n.name;
    if(!name||!n.clientId){alert("Please select a client and task name.");return;}
    S.tasks.push({id:uid(),clientId:n.clientId,type:n.type,name,activity:n.activity||"Data Entry",period:n.period,dueDate:n.dueDate,assignee:n.assignee,status:n.status,notes:n.notes,createdAt:new Date().toISOString()});
    S.nt={clientId:"",type:"GST",name:"",custom:"",activity:"",period:"",dueDate:"",assignee:S.tNames[0]||"You",status:"Pending",notes:""};
    S.showAddTask=false;sv();render();
  });
  document.querySelectorAll("[data-sid]").forEach(sel=>sel.addEventListener("change",()=>{const t=S.tasks.find(x=>x.id===sel.dataset.sid);if(t){t.status=sel.value;sv();render();}}));
  document.querySelectorAll("[data-dtid]").forEach(b=>b.addEventListener("click",()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.dtid);sv();render()}));
  on("bfmo","click",()=>{S.gFreq="monthly";render()});
  on("bfqt","click",()=>{S.gFreq="quarterly";render()});
  on("gmo","change",()=>{S.gMo=+g("gmo").value;render()});
  on("gyr","change",()=>{S.gYr=+g("gyr").value;render()});
  on("gqt","change",()=>{S.gQ=+g("gqt").value;render()});
  on("gfy","change",()=>{S.gFY=+g("gfy").value;render()});
  on("bgen","click",()=>{
    const isM=S.gFreq==="monthly";
    const period=isM?`${MNS[S.gMo-1]} ${S.gYr}`:`Q${S.gQ} FY ${S.gFY}-${String(S.gFY+1).slice(-2)}`;
    const n=generateBatch(S.gFreq,S.gMo,S.gYr,S.gQ,S.gFY);
    sv();
    if(n>0){S.tab="planner";alert(`✅ Generated ${n} tasks for ${period}. Opening Planner.`);}
    else alert("No new tasks — all already exist for this period.");
    render();
  });
}

load();
</script>
</body>
</html>
